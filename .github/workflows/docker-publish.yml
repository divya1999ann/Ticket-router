name: Publish Docker image

# Runs only after CI has passed on main — not on every push, so a broken
# lint/build never gets published even if this workflow's own trigger fired.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      # Uses the automatic GITHUB_TOKEN — no secrets to configure. Publishes
      # under ghcr.io/<owner>/ticket-router, visible only to you until you
      # choose to make the package public from GitHub's package settings.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ticket-router:latest
            ghcr.io/${{ github.repository_owner }}/ticket-router:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
